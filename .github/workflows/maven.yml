name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Exact toolchain used by releases; compiler target remains Java 25.
        java: [ '25.0.3+9' ]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test release recovery offline
        run: python3 -m unittest discover -s scripts/tests -v

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: bash ./mvnw -B -ntp clean install

      - name: Test the published module contract
        shell: bash
        run: |
          library_version=$(bash ./mvnw -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)
          echo "LIBRARY_VERSION=$library_version" >> "$GITHUB_ENV"
          bash ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.7.0:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/runtime-deps
          mkdir -p target/jpms-src/smoke target/jpms
          cat > target/jpms-src/module-info.java <<'JAVA'
          module xmldsig.smoke { requires io.github.robsonkades.xmldsig; }
          JAVA
          cat > target/jpms-src/smoke/Main.java <<'JAVA'
          package smoke;
          import io.github.robsonkades.xmldsig.SigningCredential;
          import io.github.robsonkades.xmldsig.XmlSigner;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.KeyStore;
          public class Main {
              public static void main(String[] args) throws Exception {
                  var store = KeyStore.getInstance("PKCS12");
                  char[] password = "changeit".toCharArray();
                  try (var input = Files.newInputStream(Path.of(args[0]))) {
                      store.load(input, password);
                  }
                  var signer = XmlSigner.of(SigningCredential.fromKeyStore(store, password));
                  var signed = signer.sign("<root><item Id=\"smoke\"/></root>",
                      document -> document.getDocumentElement().setAttribute("customized", "true"));
                  if (!XmlSigner.verifyIntegrity(signed).valid()) {
                      throw new AssertionError("Modular signing/verification failed");
                  }
              }
          }
          JAVA
          module_path="target/xmldsig-$library_version.jar:target/runtime-deps"
          javac --module-path "$module_path" -d target/jpms target/jpms-src/module-info.java target/jpms-src/smoke/Main.java
          java --module-path "$module_path:target/jpms" -m xmldsig.smoke/smoke.Main src/test/resources/test-keystore.p12

      - name: Compile and load benchmarks for this library version
        run: |
          bash ./mvnw -B -ntp -f benchmarks/pom.xml clean package -Dxmldsig.version="$LIBRARY_VERSION"
          java -jar benchmarks/target/benchmarks.jar -l
